{% extends "base.html" %}

{% block title %}Obras por Registrar - ARENILLAS VUELVE A BRILLAR{% endblock %}

{% block content %}
<section class="mb-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="card-title">Obras por Registrar</h1>
            <p class="card-text">Formulario para registrar nuevas obras municipales que requieren seguimiento y control.</p>
            <hr>
            <form method="POST" class="row g-3">
                <div class="col-md-6">
                    <label for="nombreObra" class="form-label">Nombre de la obra</label>
                    <input type="text" class="form-control" id="nombreObra" name="nombre" required>
                </div>
                <div class="col-md-6">
                    <label for="tipoObra" class="form-label">Tipo de obra</label>
                    <select class="form-select" id="tipoObra" name="tipo" required>
                        <option value="">Seleccione un tipo...</option>
                        <option value="Vial">Vial</option>
                        <option value="Parque">Parque</option>
                        <option value="Educación">Educación</option>
                        <option value="Salud">Salud</option>
                        <option value="Turismo">Turismo</option>
                        <option value="Servicios">Servicios Básicos</option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="descripcionObra" class="form-label">Descripción detallada</label>
                    <textarea class="form-control" id="descripcionObra" name="descripcion" rows="4" required></textarea>
                </div>
                <div class="col-md-6">
                    <label for="ubicacion" class="form-label">Ubicación</label>
                    <input type="text" class="form-control" id="ubicacion" name="ubicacion">
                </div>
                <div class="col-md-6">
                    <label for="presupuesto" class="form-label">Presupuesto Aproximado</label>
                    <input type="number" class="form-control" id="presupuesto" name="presupuesto" min="0" step="0.01">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">Registrar Obra</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </div>
            </form>
            <div class="mt-4">
                <a href="{{ url_for('hello') }}" class="btn btn-primary">Volver al Inicio</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
